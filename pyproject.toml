[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdata"
version = "1.0.0"
description = "Tabular synthetic data generation with fidelity and privacy evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
synthdata = "synthdata.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
